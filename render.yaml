services:
  - type: web
    name: heartrace-api-postmelee
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start -w @heartrace/server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ORIGINS
        value: https://heartrace-postmelee.onrender.com

  - type: web
    name: heartrace-postmelee
    runtime: static
    buildCommand: npm ci && npm run build -w @heartrace/host
    staticPublishPath: ./apps/host/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_SOCKET_URL
        value: https://heartrace-api-postmelee.onrender.com
      - key: VITE_PUBLIC_URL
        value: https://heartrace-postmelee.onrender.com
      - key: VITE_IOS_INSTALL_URL
        value: https://testflight.apple.com/join/TJXqEQfy
    headers:
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
